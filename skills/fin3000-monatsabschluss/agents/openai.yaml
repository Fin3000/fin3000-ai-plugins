interface:
  display_name: "Monatsabschluss vorbereiten"
  short_description: "Belege und Buchungen zum Monatsende prüfen"
  default_prompt: "Nutze $fin3000-monatsabschluss, um meinen Monatsabschluss in Fin3000 vorzubereiten."
dependencies:
  tools:
    - type: "mcp"
      value: "fin3000"
      description: "Fin3000 MCP-Server für den lesenden Monatscheck"
      transport: "streamable_http"
      url: "https://api.fin3000.com/mcp"
policy:
  allow_implicit_invocation: true
